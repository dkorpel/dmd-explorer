name: Deploy to GitHub Pages

# Manual deploy: builds dmd.wasm from the dkorpel/dmd wasm-web-app branch and
# publishes compiler/wasm/web as a static GitHub Pages site.
on:
  workflow_dispatch:

# Allow the workflow to deploy to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deploy; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Run the JS actions below on Node 24 (Node 20 is deprecated on the runners).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_REPO: dkorpel/dmd
  SOURCE_REF: wasm-web-app
  SOURCE_PATH: dmd/compiler/wasm/web
  PHOBOS_REPO: dlang/phobos
  PHOBOS_REF: master
  # Host compiler that bootstraps the dmd used to cross-compile to wasm.
  HOST_COMPILER: ldc-1.42.0
  # Binaryen release providing wasm-opt, which shrinks the published module.
  BINARYEN_VERSION: "123"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # dmd and phobos must be siblings: phobos's Makefile builds against
      # ../dmd, and the generated dmd.conf resolves the wasm library path
      # relative to the dmd binary as ../../../../../phobos.
      - name: Check out dmd
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: dmd

      - name: Check out Phobos
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PHOBOS_REPO }}
          ref: ${{ env.PHOBOS_REF }}
          path: phobos

      # Only used to compile dmd itself; the wasm code generation is done by
      # dmd's own wasm backend.
      - name: Install host D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ env.HOST_COMPILER }}

      - name: Install wasm-opt
        run: |
          set -eux
          url="https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fL -o binaryen.tar.gz "$url"
          mkdir -p "$RUNNER_TEMP/binaryen"
          tar -xzf binaryen.tar.gz -C "$RUNNER_TEMP/binaryen" --strip-components=1
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"

      # wasm-ld comes from LLVM; the runner image ships it as wasm-ld-<version>.
      - name: Install wasm-ld
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y lld
          test -x /usr/bin/wasm-ld || sudo ln -s "$(ls /usr/bin/wasm-ld-* | tail -1)" /usr/bin/wasm-ld
          wasm-ld --version

      # setup-dlang exports $DMD (ldmd2); build.d looks for HOST_DMD.
      - name: Build dmd
        working-directory: dmd
        run: HOST_DMD="$DMD" ./compiler/src/build.d

      # Fetches the pinned wasi-sdk sysroot (libc.a + the mmap emulation) and
      # cross-compiles druntime, then Phobos, with the dmd built above.
      - name: Build wasm druntime and Phobos
        run: |
          set -eux
          make -C dmd/druntime wasm -j$(nproc)
          make -C phobos wasm -j$(nproc)

      - name: Build dmd.wasm
        working-directory: dmd
        run: ./compiler/wasm/build.sh
        env:
          PHOBOS_ROOT: ${{ github.workspace }}/phobos

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SOURCE_PATH }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
