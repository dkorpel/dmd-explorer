name: Deploy to GitHub Pages

# Manual deploy: builds dmd.wasm from the dkorpel/dmd wasm-web-app branch,
# stores compiler/wasm/web in the `site` branch (keeping the PR builds under
# pr/) and publishes that branch to Pages.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOURCE_REPO: dkorpel/dmd
  SOURCE_REF: wasm-web-app
  SOURCE_PATH: dmd/compiler/wasm/web
  PHOBOS_REPO: dkorpel/phobos
  PHOBOS_REF: wasm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dmd and phobos must be siblings: phobos's Makefile builds against
      # ../dmd, and the generated dmd.conf resolves the wasm library path
      # relative to the dmd binary as ../../../../../phobos.
      - name: Check out dmd
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: dmd

      - name: Check out Phobos
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PHOBOS_REPO }}
          ref: ${{ env.PHOBOS_REF }}
          path: phobos

      - uses: ./.github/actions/setup-toolchain

      # setup-dlang exports $DMD (ldmd2); build.d looks for HOST_DMD.
      - name: Build dmd
        working-directory: dmd
        run: HOST_DMD="$DMD" ./compiler/src/build.d

      # Fetches the pinned wasi-sdk sysroot (libc.a + the mmap emulation) and
      # cross-compiles druntime, then Phobos, with the dmd built above.
      - name: Build wasm druntime and Phobos
        run: |
          set -eux
          make -C dmd/druntime wasm -j$(nproc)
          make -C phobos wasm -j$(nproc)

      - name: Build dmd.wasm
        working-directory: dmd
        run: ./compiler/wasm/build.sh
        env:
          PHOBOS_ROOT: ${{ github.workspace }}/phobos
          DMD: ${{ github.workspace }}/dmd/generated/linux/release/64/dmd

      - name: Update the site branch
        run: scripts/site-update.sh main "$SOURCE_PATH"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: build
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      pages: write
      id-token: write
